<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>편지가 도착했습니다</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  /* ===========================================================
     전체를 감싸는 컨테이너
     - position: fixed 대신 일반 문서 흐름(normal flow)의
       높이를 명확히 100vh로 지정해서, 어떤 뷰어/미리보기 환경에서
       열어도 화면이 찌그러지거나 안 보이는 문제를 방지합니다.
  =========================================================== */
  .page {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ===========================================================
     배경 영역
     - 지금은 별도 사진 파일 없이 바로 실행되도록
       SVG로 그린 노을 풍경을 배경으로 임시 사용 중입니다.
     - 실제 사진을 쓰려면 아래 <div id="bgWrap"> 안의
       <svg>...</svg> 전체를 지우고
       <img src="my-photo.webp" alt="background"> 한 줄로 교체하면 됩니다.
  =========================================================== */
  .bg-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transition: filter 0.9s ease;
  }

  .bg-wrap svg,
  .bg-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .bg-wrap.blurred {
    filter: blur(10px) brightness(0.6);
  }

  /* ===========================================================
     ★★★ 수정 포인트 1: 숨겨진 클릭(터치) 영역 ★★★
     top / left 를 조절해 사진 속 원하는 위치로 옮기세요.
     (퍼센트 기준이라 화면 크기가 달라져도 비율은 유지됩니다)
  =========================================================== */
  .secret-btn {
    position: absolute;
    top: 55%;     /* ← 세로 위치 (%) 수정 가능 */
    left: 55%;    /* ← 가로 위치 (%) 수정 가능 */
    width: 70px;
    height: 70px;
    transform: translate(-50%, -50%);
    border: none;
    outline: none;
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    z-index: 10;
    /* 데모 확인용: 살짝 보이게 표시함. 실제 배포 시 transparent로 변경 */
    background: rgba(255, 255, 255, 0.18);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); }
    50% { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
  }

  .secret-btn.hidden {
    display: none;
  }

  .hint-text {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  .hint-text.hidden { opacity: 0; }

  /* ===========================================================
     편지지 영역
  =========================================================== */
  .letter-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease;
    z-index: 20;
  }

  .letter-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .letter-paper {
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    background: linear-gradient(135deg, #fdf6e9 0%, #f7ecd8 100%);
    border-radius: 6px;
    padding: 36px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    transform: translateY(40px) scale(0.92);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
    position: relative;
  }

  .letter-overlay.show .letter-paper {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .letter-paper::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(150, 120, 70, 0.04),
      rgba(150, 120, 70, 0.04) 1px,
      transparent 1px,
      transparent 28px
    );
    pointer-events: none;
  }

  .letter-title {
    font-size: 17px;
    font-weight: 600;
    color: #6b4e2e;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
    position: relative;
  }

  /* ===========================================================
     ★★★ 수정 포인트 2: 편지 본문 텍스트는
     아래 <div class="letter-body" id="letterBody"> 안쪽을 수정하세요.
     줄바꿈은 그대로 적용됩니다.
  =========================================================== */
  .letter-body {
    font-size: 15px;
    line-height: 1.9;
    color: #4a3a26;
    white-space: pre-line;
    word-break: keep-all;
    position: relative;
  }

  .letter-signature {
    margin-top: 26px;
    text-align: right;
    font-size: 14px;
    color: #8a6d45;
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    color: #a78a5e;
    cursor: pointer;
    line-height: 1;
    padding: 6px;
  }

  .letter-paper::-webkit-scrollbar { width: 4px; }
  .letter-paper::-webkit-scrollbar-thumb { background: rgba(150,120,70,0.3); border-radius: 2px; }
</style>
</head>
<body>

  <div class="page">

    <!-- 배경: 지금은 별도 파일 없이 바로 실행되도록 SVG 노을 풍경을 사용 중 -->
    <div class="bg-wrap" id="bgWrap">
      <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2b2150"/>
            <stop offset="35%" stop-color="#6c3a6e"/>
            <stop offset="60%" stop-color="#d9683f"/>
            <stop offset="100%" stop-color="#f6b364"/>
          </linearGradient>
          <radialGradient id="sun" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff3d6"/>
            <stop offset="60%" stop-color="#ffcf7a"/>
            <stop offset="100%" stop-color="rgba(255,207,122,0)"/>
          </radialGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7a3c52"/>
            <stop offset="100%" stop-color="#1b1430"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="400" height="800" fill="url(#sky)"/>
        <circle cx="220" cy="430" r="160" fill="url(#sun)"/>
        <circle cx="220" cy="430" r="68" fill="#ffe4ac"/>

        <ellipse cx="90" cy="230" rx="90" ry="16" fill="rgba(255,255,255,0.12)"/>
        <ellipse cx="300" cy="300" rx="70" ry="12" fill="rgba(255,255,255,0.10)"/>
        <ellipse cx="150" cy="160" rx="60" ry="10" fill="rgba(255,255,255,0.08)"/>

        <rect x="0" y="460" width="400" height="340" fill="url(#sea)"/>
        <ellipse cx="220" cy="462" rx="160" ry="14" fill="#ffd79b" opacity="0.5"/>
        <ellipse cx="220" cy="490" rx="120" ry="10" fill="#ffd79b" opacity="0.3"/>
        <ellipse cx="220" cy="520" rx="90" ry="8" fill="#ffd79b" opacity="0.2"/>

        <path d="M70 200 q8 -10 16 0 q8 -10 16 0" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M250 170 q7 -9 14 0 q7 -9 14 0" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 숨겨진 비밀 클릭 버튼 -->
    <button class="secret-btn" id="secretBtn" aria-label="편지 열기"></button>
    <div class="hint-text" id="hintText">✦ 사진 속 빛나는 부분을 살짝 눌러보세요 ✦</div>

    <!-- 편지지 오버레이 -->
    <div class="letter-overlay" id="letterOverlay">
      <div class="letter-paper">
        <button class="close-btn" id="closeBtn">✕</button>
        <div class="letter-title">To. 너에게</div>

        <div class="letter-body" id="letterBody">안녕,

오랜만에 이렇게 편지를 써.
평소엔 잘 못했던 말들을
이 작은 편지지에 담아봤어.

항상 고맙고, 늘 응원할게.
오늘도 좋은 하루 보내길 바라.

- 너의 친구가</div>

        <div class="letter-signature">From. 마음을 담아</div>
      </div>
    </div>

  </div>

<script>
  (function () {
    var bgWrap = document.getElementById('bgWrap');
    var secretBtn = document.getElementById('secretBtn');
    var hintText = document.getElementById('hintText');
    var letterOverlay = document.getElementById('letterOverlay');
    var closeBtn = document.getElementById('closeBtn');

    function openLetter() {
      bgWrap.classList.add('blurred');
      letterOverlay.classList.add('show');
      secretBtn.classList.add('hidden');
      hintText.classList.add('hidden');
    }

    function closeLetter() {
      bgWrap.classList.remove('blurred');
      letterOverlay.classList.remove('show');
    }

    secretBtn.addEventListener('click', openLetter);
    closeBtn.addEventListener('click', closeLetter);

    letterOverlay.addEventListener('click', function (e) {
      if (e.target === letterOverlay) closeLetter();
    });
  })();
</script>

</body>
</html>
